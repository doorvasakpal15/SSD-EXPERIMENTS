<!DOCTYPE html>
<html>

<head>

    <title>Input Validation and Encoding</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            background-color: #eeeeee;
        }

        .output {
            margin-top: 15px;
            padding: 10px;
            background-color: #eeeeee;
            word-wrap: break-word;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Input Validation & Encoding</h1>

    <form method="POST">

        <label>Name:</label>
        <input
            type="text"
            name="name"
            placeholder="Enter your name"
        >

        <label>Email:</label>
        <input
            type="text"
            name="email"
            placeholder="Enter your email"
        >

        <label>Address:</label>
        <input
            type="text"
            name="address"
            placeholder="Enter your address"
        >

        <button type="submit">
            Submit
        </button>

    </form>


    {% if message %}

        <div class="message">
            <strong>{{ message }}</strong>
        </div>

    {% endif %}


    {% if encoded_message %}

        <div class="output">

            <strong>Encoded / Safe Output:</strong>

            <p>{{ encoded_message }}</p>

        </div>

    {% endif %}

</div>

</body>

</html>
